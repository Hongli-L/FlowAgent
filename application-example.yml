# FlowAgent Example Configuration
# Copy this file to application-local.yml and adjust values for your environment.

server:
  port: 7880
  servlet:
    context-path: /

spring:
  application:
    name: flowagent

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/flowagent?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: your_password_here
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  ai:
    openai:
      api-key: "your_llm_api_key_here"
      base-url: https://api.openai.com   # or your compatible endpoint

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.flowagent.persistence.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

workflow:
  engine:
    type: LEGACY           # LEGACY | LANGGRAPH
    mode: SEQUENTIAL       # SEQUENTIAL | PARALLEL
    node-timeout: 300
    workflow-timeout: 600
    core-pool-size: 16     # CPU cores * 2 for IO-intensive
    max-pool-size: 50
    queue-capacity: 200
    keep-alive-seconds: 60
    max-context-tokens: 8192

logging:
  level:
    root: INFO
    com.flowagent: DEBUG
