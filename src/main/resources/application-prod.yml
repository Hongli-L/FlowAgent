# 'prod' profile: hardened variant for a public cloud deploy.
# Activate with SPRING_PROFILES_ACTIVE=prod (or --spring.profiles.active=prod).
# Inherits datasource / redis / engine settings from application.yml; this file
# only overrides what should differ in production.

spring:
  # Flyway still owns the schema on MySQL startup.
  flyway:
    enabled: true

# Do not expose internals publicly: health only, no detail, no metrics endpoint.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# The interactive API console is a dev convenience; keep it closed in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Production-grade circuit breaker tuning: larger window + higher failure tolerance so a
# single transient blip does not trip the breaker; longer cool-down before half-open probe.
resilience4j:
  circuitbreaker:
    sliding-window-size: 20
    minimum-number-of-calls: 10
    failure-rate-threshold: 60
    wait-duration-in-open-state: 60s
    permitted-number-of-calls-in-half-open-state: 5
    automatic-transition-from-open-to-half-open-enabled: true
    register-health-indicator: true

logging:
  level:
    root: INFO
    com.flowagent: INFO
