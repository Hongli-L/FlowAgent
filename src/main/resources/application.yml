server:
  port: 7880
  servlet:
    context-path: /

spring:
  application:
    name: flowagent

  # Execute schema.sql on every startup so tables self-bootstrap (idempotent via IF NOT EXISTS).
  sql:
    init:
      mode: always

  # Redis middleware (Phase 2.2): Redisson distributed lock + two-level cache + rate limit
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  # RedissonClient is built explicitly in RedisConfiguration; suppress the starter auto-config
  # to avoid a duplicate RedissonClient bean.
  autoconfigure:
    exclude: org.redisson.spring.starter.RedissonAutoConfiguration

  # Database configuration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:flowagent}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 580000
      connection-test-query: SELECT 1
      validation-timeout: 5000
  
  ai:
    # Spring-ai requires api-key; we actually obtain apiKey from workflow orchestration at runtime
    openai:
      api-key: "test"

  # JSON configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# MyBatis Plus configuration
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.flowagent.persistence.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      # In production, change to 'never' for security
      show-details: always
  health:
    db:
      enabled: true

# Logging configuration
logging:
  level:
    root: INFO
    com.flowagent: DEBUG
    org.springframework.web: INFO
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: /app/logs/flowagent-engine.log
    max-size: 100MB
    max-history: 30

# Workflow engine configuration
workflow:
  engine:
    type: ${WORKFLOW_ENGINE_TYPE:LEGACY}
    node-timeout: 300
    workflow-timeout: 600
    core-pool-size: ${WORKFLOW_CORE_POOL_SIZE:16}
    max-pool-size: ${WORKFLOW_MAX_POOL_SIZE:50}
    queue-capacity: ${WORKFLOW_QUEUE_CAPACITY:200}
    keep-alive-seconds: 60
    max-context-tokens: ${WORKFLOW_MAX_CONTEXT_TOKENS:8192}

# Redisson client reference (used by RedisConfiguration). The redisson-spring-boot-starter
# auto-config is excluded, so this block is documentation only; RedisConfiguration reads
# spring.data.redis instead.
redisson:
  config: |
    singleServerConfig:
      address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
      database: ${REDIS_DB:0}
      connectionPoolSize: 16
      connectionMinimumIdleSize: 4

# HTTP tool node (Phase 2.4): external API invocation timeout for OkHttp client
tool:
  timeout-seconds: 10
